# A1 Models and Scripts. Human-readable spec: spec.md (keep the two in step).
assignment: A1
title: Models and Scripts
reference_dir: ../ae2440-solutions/w01_modeling_scripts   # relative to the repo root; files named <name>_soln.m
required_files: [penny.m, pennywithair.m, bike_update.m, aquarium.m]
grade:
  pass: 100
  fail: 90
max_suggestions: 5

checks:
  - id: F1
    file: all
    kind: files
    graded: true
    pass: "All four files submitted with the exact names."
    fail: "Missing or misnamed: {missing}. File names are case-sensitive and must match the assignment exactly."

  - id: R1
    file: [penny.m, pennywithair.m, aquarium.m]   # bike_update.m needs m and pg preset
    kind: runs
    graded: true
    pass: "Every script runs from a clean workspace."
    fail: "{file} stopped with an error: \"{error}\". Run `clear` and then your script before submitting to catch this."

  - id: V1
    file: penny.m
    kind: value
    graded: false
    rtol: 0.01
    expect_all: [8.8134, 86.459]   # any variable names
    pass: "penny.m matches the reference values."
    fail: "penny.m: expected a fall time of about 8.81 s and an impact speed of about 86.5 m/s. Check the formula and the value of g."

  - id: V2
    file: aquarium.m
    kind: value
    graded: false
    rtol: 0.05
    expect_any: [154507.5, 154.5075]
    pass: "aquarium.m matches the given solution."
    fail: "aquarium.m: the resultant force should be about 154.5 kN for a = 2 m, b = 3 m."

  - id: S1
    file: aquarium.m
    kind: static
    graded: false
    min_text_blocks: 2
    min_code_blocks: 2
    fail: "aquarium.m: alternate text and code blocks so each step of the solution is explained next to its calculation."
