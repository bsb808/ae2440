project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "weeks/**/*.qmd"
    - "resources/**/*.qmd"
    - "archive/**/*.qmd"

website:
  title: "AE 2440 — Introduction to Scientific Programming"
  # GitHub Pages project site: served under /ae2440/, so all links must be relative (never start with /).
  site-url: https://bsb808.github.io/ae2440/
  favicon: favicon.png
  repo-url: https://github.com/bsb808/ae2440
  search: false
  navbar:
    pinned: true
    # Distinguish from the ME2801 site (stock cosmo blue): deep teal drawn from the membrane logo, plus the logo itself.
    background: "#1f4e5f"
    foreground: "#ffffff"
    logo: favicon.png
    logo-alt: "AE 2440"
    left:
      - href: index.qmd
        text: Schedule
      - href: syllabus.qmd
        text: Syllabus
      - href: assignments.qmd
        text: Assignments
      - href: resources/textbook.qmd
        text: Textbook
      - text: Resources
        menu:
          - href: resources/installing_matlab.qmd
            text: Installing MATLAB
          - href: resources/matlab.qmd
            text: MATLAB Resources
    right:
      - icon: github
        href: https://github.com/bsb808/ae2440
        aria-label: Source on GitHub
  page-footer:
    left: "© Brian Bingham · [Source on GitHub](https://github.com/bsb808/ae2440)"
    right: "Built with [Quarto](https://quarto.org/)"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    html-math-method: mathjax
    link-external-newwindow: true
    link-external-icon: true
    grid:
      body-width: 1400px       # default 800; raise the cap so wide monitors are used
      margin-width: 200px
      sidebar-width: 200px
